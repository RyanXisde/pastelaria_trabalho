<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La casa de Pastel</title>
</head>
<body>
<script src="script.js"></script>
    <h1>Lá casa de Pastel</h1>
    <form id="FormPastel">
        Nome do Cliente = <input type="text" name="Nome" id="Nome" placeholder="Seu Nome">
        <br>

        CPF = <input type="text" name="cpf" id="cpf" placeholder="Seu CPF"><br>

        Endereço = <input type="text" name="endereço" id="endereço" placeholder="Seu Endereço"><br>

        <label>Pastel =
            <select id="Cardapio"></select>
        </label><br>
        
        <label>Tamanho =
            <select id="Tamanho"></select>
        </label><br>



        <label>Forma de Pagamento: </label><br>
            <input type="radio" name="pagamento" id="pagamento" value="pix"> Pix

            <input type="radio" name="pagamento" id="pagamento" value="débito"> Débito

            <input type="radio" name="pagamento" id="pagamento" value="crédito"> Crédito

            <input type="radio" name="pagamento" id="pagamento" value="dinheiro"> Dinheiro
        

        <h1>Informações Importantes</h1>
        Endereço do Estabelecimento = <input type="text" name="endereçoo" value="Rua Lisboa, 435 - Jardim Panorama" readonly>
        <br>
        Número de Telefone do Estabelecimento = <input type="text" name="numeroo" value="(45)9914501514" readonly>
    </form>
</body>
</html>
